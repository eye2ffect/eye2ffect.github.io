<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Data structures and algorithms illustration</title>
  <desc id="desc">A binary tree connected to an array of game-board states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="190" cy="520" r="215" fill="#d9e5ff" opacity=".48"/>
  <g stroke="#91a9dc" stroke-width="7" stroke-linecap="round">
    <path d="M600 180 410 290m190-110 190 110M410 330 300 425m110-95 110 95m170-95 110 95m-110-95 110 95"/>
  </g>
  <g fill="#fffefb" stroke="#4779ed" stroke-width="6">
    <circle cx="600" cy="150" r="48"/>
    <circle cx="410" cy="310" r="44"/>
    <circle cx="790" cy="310" r="44"/>
    <circle cx="300" cy="450" r="38"/>
    <circle cx="520" cy="450" r="38"/>
    <circle cx="680" cy="450" r="38"/>
    <circle cx="900" cy="450" r="38"/>
  </g>
  <g fill="#4779ed" font-family="monospace" font-size="27" font-weight="700" text-anchor="middle">
    <text x="600" y="159">N</text>
    <text x="410" y="319">L</text>
    <text x="790" y="319">R</text>
    <text x="300" y="459">0</text>
    <text x="520" y="459">1</text>
    <text x="680" y="459">2</text>
    <text x="900" y="459">3</text>
  </g>
  <g transform="translate(95 245)">
    <rect width="115" height="72" rx="12" fill="#fffefb" stroke="#c6d3ed" stroke-width="4"/>
    <rect x="125" width="115" height="72" rx="12" fill="#fffefb" stroke="#c6d3ed" stroke-width="4"/>
    <rect x="250" width="115" height="72" rx="12" fill="#4779ed"/>
    <rect x="375" width="115" height="72" rx="12" fill="#fffefb" stroke="#c6d3ed" stroke-width="4"/>
    <g fill="#4a5872" font-family="monospace" font-size="23" text-anchor="middle">
      <text x="57" y="46">[0]</text>
      <text x="182" y="46">[1]</text>
      <text x="307" y="46" fill="#fff">[2]</text>
      <text x="432" y="46">[3]</text>
    </g>
  </g>
  <text x="600" y="540" text-anchor="middle" fill="#4a5872" font-family="monospace" font-size="22" letter-spacing="5">MODEL · ORGANIZE · SOLVE</text>
